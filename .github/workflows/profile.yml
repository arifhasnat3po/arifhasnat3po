name: Profile checks and snapshot

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: profile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: node --test scripts/*.test.mjs
      - run: node scripts/check-profile.mjs

  refresh:
    needs: check
    if: github.repository == 'arifhasnat3po/arifhasnat3po' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Refresh public data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/update-profile.mjs
      - run: node scripts/check-profile.mjs
      - name: Save changed snapshot only
        run: |
          git add README.md assets/github-stats-*.svg assets/github-languages-*.svg assets/github-activity-*.svg
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: refresh public GitHub snapshot'
          git push origin HEAD:main
