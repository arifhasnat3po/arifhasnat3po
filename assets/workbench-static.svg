<svg xmlns="http://www.w3.org/2000/svg" width="860" height="180" viewBox="0 0 860 180" role="img" aria-labelledby="title desc">
<title id="title">From packets to products</title><desc id="desc">Explore: find the question. Build: make it work. Test: try the edge cases. Ship: leave good docs. An animated packet connects the four steps.</desc>
<rect x=".5" y=".5" width="859" height="179" rx="5" fill="#0d1117" stroke="#30363d"/>
<path d="M28 56H820" stroke="#303b49" stroke-width="2"/>
<path class="packet" d="M28 56H820" stroke="#56c781" stroke-width="2" stroke-dasharray="24 756"/>
<circle cx="28" cy="56" r="5" fill="#0d1117" stroke="#56c781" stroke-width="2"/><text x="28" y="105" fill="#e6edf3" font-size="21" font-weight="600">Explore</text><text x="28" y="135" fill="#a7b6c8" font-size="15">Find the question</text><circle cx="235" cy="56" r="5" fill="#0d1117" stroke="#56c781" stroke-width="2"/><text x="235" y="105" fill="#e6edf3" font-size="21" font-weight="600">Build</text><text x="235" y="135" fill="#a7b6c8" font-size="15">Make it work</text><circle cx="442" cy="56" r="5" fill="#0d1117" stroke="#56c781" stroke-width="2"/><text x="442" y="105" fill="#e6edf3" font-size="21" font-weight="600">Test</text><text x="442" y="135" fill="#a7b6c8" font-size="15">Try the edge cases</text><circle cx="649" cy="56" r="5" fill="#0d1117" stroke="#56c781" stroke-width="2"/><text x="649" y="105" fill="#e6edf3" font-size="21" font-weight="600">Ship</text><text x="649" y="135" fill="#a7b6c8" font-size="15">Leave good docs</text>
<style>text{font-family:Arial,Helvetica,sans-serif}.packet{animation:none}@keyframes travel{to{stroke-dashoffset:-780}}@media(prefers-reduced-motion:reduce){.packet{animation:none}}</style></svg>
